<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            color: #FFFFFF;
            background-color: #999;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 2fr;
            grid-auto-rows: 1fr;
            grid-template-areas:
                "header header"
                "content content"
            ;
            width: 850px;
            height: 800px;
            background-color: rgb(13, 18, 24);
            gap: 20px;
            border-radius: 20px;
        }

        .header {
            background-color: rgb(30, 41, 50);
            grid-area: header;
            border-radius: 10px;
            padding: 20px;
            font-size: 1rem;
        }

        .content {
            grid-area: content;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            padding: 0 20px 15px 20px;
        }

        .content div {
            border-radius: 10px;
            background-color: rgb(20, 30, 37);
        }

        /*Termina el esquema base*/

        #tank-container {
            display: grid;
            grid-template-rows: auto 1fr;
            place-items: center;
            font-weight: bolder;
            padding: 0 0 10px 0;

        }

        #tank-header,
        #plot-header,
        #setting-header {
            place-self: start;
            padding: 5px 0px 0px 20px;
            height: auto;
        }

        #tank {
            border: 1px solid #FFFFFF;
            width: 250px;
            height: 200px;
            position: relative;
            overflow: hidden;
        }

        #liquid {
            position: absolute;
            height: 0%;
            width: 100%;
            background-color: rgb(54, 153, 246);
            bottom: 0;
            z-index: 5;
        }

        #setpoint {
            position: absolute;
            width: 100%;
            border: 1px solid red;
            bottom: 0%;
            height: 0;
            z-index: 6;
        }

        #readout {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            top: 10px;
            z-index: 10;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 5px;
        }

        #plot {
            display: grid;
            grid-template-rows: auto 1fr;
            place-items: center;
            font-weight: bolder;
            padding: 0 0 10px 0;
        }

        /*Terminado tank*/

        .slider-group {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            margin-left: 20px;
            height: 70%;
        }

        .buttons-container {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }

        .stop {
            background-color: red;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            cursor: pointer;
            border-radius: 20px;
        }

        .start {
            background-color: green;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            cursor: pointer;
            border-radius: 20px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PID TANK CONTROLLER</title>
</head>

<body>
    <div class="container">
        <div class="header">
            <h2>TANK PID DASHBOARD</h2>
        </div>
        <div class="content">
            <div id="tank-container">
                <h2 id="tank-header">Level Indicator</h2>
                <div id="tank">
                    <div id="liquid"></div>
                    <div id="setpoint"></div>
                    <div id="readout">0%</div>
                </div>
            </div>
            <div class="slider-container">
                <h2 id="setting-header">PID Settings</h2>
                <div class="slider-group">
                    <div class="slider-wrapper">
                        <input type="range" class="pid-slider" id="kp" step="0.1">
                        <span class="kp-readout">0</span>
                        <label for="kp">Kp</label>
                    </div>
                    <div class="slider-wrapper">
                        <input type="range" class="pid-slider" id="ki">
                        <span class="slider-value">0</span>
                        <label for="ki">Ki</label>
                    </div>
                    <div class="slider-wrapper">
                        <input type="range" class="pid-slider" id="kd">
                        <span class="slider-value">0</span>
                        <label for="kd">Kd</label>
                    </div>
                    <div class="slider-wrapper">
                        <input type="range" class="pid-slider" id="st" step="0.1" min="0" max="36">
                        <span class="setpoint-value">0</span>
                        <label for="st">Setpoint</label>
                    </div>
                </div>
            </div>
            <div id="plot">
                <h2 id="plot-header">Respuesta del Sistema</h2>
                <canvas id="chart" width="300" height="200"></canvas>
            </div>
            <div class="buttons-container">
                <button class="start">START</button>
                <button class="stop">STOP</button>
            </div>
        </div>
    </div>
    <script src="./smoothie.js"></script>
    <script src="./js.js"></script>
</body>

</html>
